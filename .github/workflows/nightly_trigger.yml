
name: Nightly CI/CD Pipeline

on:
#  schedule:
#    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  job_build_python:
    uses: ./.github/workflows/backend_job.yml

  job_build_typescript:
    uses: ./.github/workflows/frontend_job.yml

  job_sonar_analysis:
    name: Start sonar analysis
    runs-on: ubuntu-latest
    needs:
      - job_build_python
      - job_build_typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
