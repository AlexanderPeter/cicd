
name: Nightly CI/CD Pipeline

on:
  #  schedule:
  #    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  job_build_backend:
    uses: ./.github/workflows/backend_job.yml

  job_build_frontend:
    uses: ./.github/workflows/frontend_job.yml

  job_e2e_tests:
    name: Run e2e tests
    runs-on: ubuntu-latest
    needs:
      - job_build_backend
      - job_build_frontend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: localuser
          POSTGRES_PASSWORD: localpass
          POSTGRES_DB: localdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://localuser:localpass@127.0.0.1:5432/localdb

    steps:
      # --------------- Get dependencies ---------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize database schema
        working-directory: database
        run: |
          psql postgresql://localuser:localpass@127.0.0.1:5432/localdb -f schema.sql

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore NPM cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # --------------- Execute e2e ---------------

      - name: Start backend server
        working-directory: backend
        run: |
          source .venv/bin/activate
          python app.py > backend.log 2>&1 &

      - name: Start frontend server with coverage
        working-directory: frontend
        run: |
          nohup npm run start-coverage &

      - name: Wait for backend
        run: |
          until curl --silent http://localhost:5000/; do
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Wait for frontend
        run: |
          until curl --silent http://localhost:3000; do
          echo "Waiting for frontend..."
          sleep 2
          done

      - name: Run e2e tests
        working-directory: frontend
        run: npm run e2e-headless

      - name: Show backend logs
        if: always()
        working-directory: backend
        run: cat backend.log || echo "No backend logs"

      - name: Upload e2e screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: frontend/e2e/screenshots

      # --------------- Analyze sonar ---------------

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Merge coverage reports
        working-directory: frontend
        run: npm run coverage-merge

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
